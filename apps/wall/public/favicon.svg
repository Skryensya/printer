<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg   { fill: #fffcf0; }
    .ink  { fill: #100f0f; }
    .ring { fill: none; stroke: #100f0f; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #100f0f; }
      .ink  { fill: #cecdc3; }
      .ring { stroke: #cecdc3; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7"/>
  <circle class="ring" cx="16" cy="16" r="10.5" stroke-width="1.5" opacity="0.22"/>
  <circle class="ring" cx="16" cy="16" r="6.5"  stroke-width="1.5" opacity="0.45"/>
  <circle class="ink"  cx="16" cy="16" r="3"/>
</svg>
